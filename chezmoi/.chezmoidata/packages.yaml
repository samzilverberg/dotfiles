# Packages installed by .chezmoiscripts/run_onchange_after_20-packages.sh.tmpl
# (re-runs whenever the rendered list changes). Nothing is ever uninstalled automatically.
packages:
  darwin:
    taps: []
    brews:
      - git
      - gnupg
      - pinentry-mac
      - coreutils
      - wget
      - httpie
      - jq
      - fish
      - fisher
      - zsh
      - zsh-completions
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - starship
      - zoxide
      - fzf
      - fd             # fzf.fish directory search
      - mise
      - bat
      - eza
      - the_silver_searcher
      - neovim
      - lazygit
      - gh
      - chezmoi
      - gitleaks
      - git-filter-repo
      - rtk
      - telnet
      - ffmpeg
      - yt-dlp
      - kubernetes-cli
      - k9s
      - helm
      - krew
      - awscli
    casks:
      - 1password
      - 1password-cli
      - iterm2
      - firefox
      - google-chrome
      - zen
      - bettertouchtool
      - raycast
      - jordanbaird-ice
      - ddpm
      - docker-desktop
      - dropbox
      - syncthing-app
      - tailscale-app
      - macfuse
      - veracrypt
      - font-hack-nerd-font
      - font-meslo-lg-nerd-font
      - obsidian
      - qlmarkdown
      - slack
      - spotify
      - zoom
      - visual-studio-code
      - webstorm
      - gcloud-cli
      - claude
      - t3-code
      - token-monitor

  # Linux: native package managers only (no Homebrew). Picked by the distro family.
  apt:
    - git
    - curl
    - wget
    - gnupg
    - openssh-client
    - fish
    - zsh
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - jq
    - fzf
    - fd-find        # binary is `fdfind` on Debian/Ubuntu, packages script links ~/.local/bin/fd
    - zoxide
    - bat            # binary is `batcat` on Debian/Ubuntu, fish config aliases it
    - gh
    - silversearcher-ag
    - neovim
    - httpie
    - unzip
  dnf:
    - git
    - curl
    - wget
    - gnupg2
    - openssh-clients
    - fish
    - zsh
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - jq
    - fzf
    - fd-find
    - zoxide
    - bat
    - gh
    - the_silver_searcher
    - neovim
    - httpie
    - unzip
  # Linux tools not (reliably) packaged by distros: installed to ~/.local/bin via upstream installers if missing
  linux_installers:
    - starship
    - mise

  profiles:
    payzen:
      darwin:
        taps:
          - hashicorp/tap
        brews:
          - docker-credential-helper-ecr
          - hashicorp/tap/terraform
          - temporal
          - crane
          - actionlint
          - googleworkspace-cli
        casks: []
